name: Build and Push (GHCR)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # push to GHCR
      id-token: write       # Cosign keyless signing via GitHub OIDC
      security-events: write # upload Trivy SARIF to GitHub Security tab

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          no-cache: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/muserrenamer:latest
            ghcr.io/${{ github.repository_owner }}/muserrenamer:${{ github.sha }}

      # -----------------------------------------------------------------------
      # Trivy — afiseaza TOATE CVE-urile in log (nu blocheaza) ca sa vedem lista
      # -----------------------------------------------------------------------
      - name: Trivy scan (debug - show all CVEs)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/muserrenamer:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'
          ignore-unfixed: false
          vuln-type: os,library

      # -----------------------------------------------------------------------
      # Trivy — SARIF pentru Security tab (nu blocheaza momentan)
      # -----------------------------------------------------------------------
      - name: Trivy scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/muserrenamer:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library

      - name: Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      # -----------------------------------------------------------------------
      # Cosign — semneaza imaginea keyless via GitHub OIDC
      # -----------------------------------------------------------------------
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with Cosign (keyless)
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/muserrenamer@${{ steps.build.outputs.digest }}
        env:
          COSIGN_EXPERIMENTAL: "1"
